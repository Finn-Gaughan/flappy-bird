name: Build executables

on:
  workflow_dispatch:
  push:
    branches: [main]
    tags: ["v*"]

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            artifact-name: FlappyBird-windows
            asset-path: dist/FlappyBird.exe
          - os: macos-latest
            artifact-name: FlappyBird-macos
            asset-path: FlappyBird-mac.zip
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pygame pgzero pyinstaller

      - name: Build with PyInstaller
        run: pyinstaller FlappyBird.spec --noconfirm --clean

      - name: Package macOS app (zip)
        if: runner.os == 'macOS'
        run: |
          cd dist
          ditto -c -k --keepParent FlappyBird.app ../FlappyBird-mac.zip

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact-name }}
          path: ${{ matrix.asset-path }}
          if-no-files-found: error

      - name: Attach to GitHub Release (tag builds)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: ${{ matrix.asset-path }}
